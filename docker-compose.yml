# Optional shared reverse-proxy network: set DOCKER_SHARED_NETWORK in .env and use compose.ps1 / compose.sh.

services:
  technical_scanner_postgres:
    image: postgres:16
    container_name: technical_scanner_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-technical_scanner}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ${POSTGRES_DATA_PATH:-./data/postgres}:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-technical_scanner}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  technical_scanner_api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    container_name: technical_scanner_api
    env_file:
      - path: .env
        required: false
    environment:
      ASPNETCORE_URLS: http://0.0.0.0:8080
      ConnectionStrings__TechnicalScanner: Host=technical_scanner_postgres;Port=5432;Database=${POSTGRES_DB:-technical_scanner};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${API_PORT:-5223}:8080"
    depends_on:
      technical_scanner_postgres:
        condition: service_healthy
    restart: unless-stopped

  technical_scanner_web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: technical_scanner_web
    ports:
      - "${WEB_PORT:-3080}:80"
    depends_on:
      - technical_scanner_api
    restart: unless-stopped

  technical_scanner_worker:
    profiles: ["worker"]
    build:
      context: .
      dockerfile: Dockerfile
      target: worker
    container_name: technical_scanner_worker
    env_file:
      - path: .env
        required: false
    environment:
      ConnectionStrings__TechnicalScanner: Host=technical_scanner_postgres;Port=5432;Database=${POSTGRES_DB:-technical_scanner};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres}
    depends_on:
      technical_scanner_postgres:
        condition: service_healthy
    volumes:
      - ./exports:/app/exports
    restart: "no"
